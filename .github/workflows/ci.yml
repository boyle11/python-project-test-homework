name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: python setup
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: dependency install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: test run
        run: python -m pytest -v